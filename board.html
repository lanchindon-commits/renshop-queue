<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="叫號看板">
<meta name="theme-color" content="#0f0f10">
<link rel="manifest" href="board.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>叫號看板</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --brand:#e8501b; --ink:#111; --bg:#0f0f10; --panel:#1b1b1d; --muted:#9a9aa0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; overflow:hidden; }
  .wrap { display:grid; grid-template-columns: 2.2fr 1fr; gap:2vw; height:100vh; height:100dvh; padding:max(3vw, env(safe-area-inset-top)) max(3vw, env(safe-area-inset-right)) max(3vw, env(safe-area-inset-bottom)) max(3vw, env(safe-area-inset-left)); }
  .now { background:var(--panel); border-radius:2vw; display:flex; flex-direction:column; padding:2.4vw; min-width:0; }
  .now .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:1.6vw; }
  .now .t { font-size:3vw; color:#ddd; font-weight:700; letter-spacing:.3vw; }
  .now .cap { font-size:2vw; color:var(--muted); }
  .tiles { flex:1; display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(2, 1fr); gap:1.4vw; min-height:0; }
  .tile { border-radius:1.4vw; background:#26262a; display:flex; align-items:center; justify-content:center; font-size:5.4vw; font-weight:900; letter-spacing:.2vw; color:#fff; min-width:0; overflow:hidden; }
  .tile.empty { color:#3a3a3f; font-size:4vw; font-weight:600; }
  .tile.latest { background:var(--brand); color:#fff; box-shadow:0 0 0 .4vw rgba(232,80,27,.35); }
  .tile.flash { animation:flash 1s ease-in-out 3; }
  .tiles.idle { display:flex; align-items:center; justify-content:center; font-size:4vw; color:#666; font-weight:600; }
  @keyframes flash { 50% { transform:scale(1.06); filter:brightness(1.3); } }
  .side { display:flex; flex-direction:column; gap:2vw; }
  .box { background:var(--panel); border-radius:2vw; padding:2vw 2.4vw; }
  .box h3 { margin:0 0 1vw; font-size:2.2vw; color:var(--muted); font-weight:600; }
  .count { font-size:6vw; font-weight:800; }
  .count small { font-size:2.4vw; color:var(--muted); font-weight:500; margin-left:.6vw; }
  .next { display:flex; flex-wrap:wrap; gap:1vw; margin-top:1vw; }
  .next span { font-size:2.6vw; background:#2a2a2d; padding:.4vw 1.2vw; border-radius:1vw; }
  .qr { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center; min-height:0; }
  .qr #qrcode { background:#fff; padding:1vw; border-radius:1vw; line-height:0; }
  .qr #qrcode img, .qr #qrcode canvas { display:block; }
  .qr p { margin:1.2vw 0 0; font-size:2vw; line-height:1.4; }
  .qr p b { color:var(--brand); }
  #unlock { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; font-size:3vw; cursor:pointer; z-index:9; }
  #unlock span { border:2px solid #fff; padding:2vw 4vw; border-radius:2vw; text-align:center; line-height:1.6; }
  #unlock small { display:block; font-size:1.6vw; opacity:.7; }
  #fsBtn { position:fixed; right:1vw; bottom:1vw; z-index:8; background:rgba(255,255,255,.08); color:#888; border:0; border-radius:1vw; font-size:1.4vw; padding:.6vw 1vw; cursor:pointer; }
  :fullscreen #fsBtn, :-webkit-full-screen #fsBtn { display:none; }
  #a2hs { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:10; font-size:2.6vw; }
  #a2hs span { background:#1b1b1d; border-radius:2vw; padding:3vw 4vw; text-align:center; line-height:1.6; }
  #a2hs small { display:block; text-align:left; font-size:1.9vw; color:#ccc; margin:1.5vw 0 2vw; }
  #a2hs b { display:inline-block; background:#e8501b; padding:.8vw 3vw; border-radius:1vw; font-size:2vw; }
</style>
</head>
<body>
<div id="unlock"><span>點一下畫面開始<small>全螢幕顯示＋開啟叫號提示音</small></span></div>
<button id="fsBtn">⛶ 全螢幕</button>
<div class="wrap">
  <div class="now">
    <div class="head"><div class="t">目前維修號碼</div><div class="cap" id="cap"></div></div>
    <div class="tiles idle" id="tiles">目前沒有叫號</div>
  </div>
  <div class="side">
    <div class="box">
      <h3>等候中</h3>
      <div class="count"><span id="cnt">0</span><small>位</small></div>
      <div class="next" id="next"></div>
    </div>
    <div class="box qr">
      <div id="qrcode"></div>
      <p>還沒取號嗎？<br>用 LINE 掃描 <b>線上取號</b></p>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://hxzdmosganinyhtrswlj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AYWfHD9vBAVk4Fv1tcuEVw_RTPM71RQ';
const LIFF_URL = 'https://liff.line.me/2009551033-oZpYRgSW';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let lastTop = null, audio = null;

function drawQR() {
  const box = document.querySelector('.qr'), el = document.getElementById('qrcode'), txt = box.querySelector('p');
  const pad = innerWidth * 0.02;
  const size = Math.floor(Math.min(box.clientWidth * 0.8, box.clientHeight - txt.offsetHeight - innerWidth * 0.06) - pad);
  el.innerHTML = '';
  new QRCode(el, { text: LIFF_URL, width: Math.max(120, size), height: Math.max(120, size), correctLevel: QRCode.CorrectLevel.M });
}
drawQR();
let qrTimer; addEventListener('resize', () => { clearTimeout(qrTimer); qrTimer = setTimeout(drawQR, 300); });

// iPad / iPhone：Safari 的全螢幕會蓋上很大的關閉鈕，改用「加入主畫面」
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_APP = window.navigator.standalone || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
function showA2HS() {
  const d = document.createElement('div');
  d.id = 'a2hs';
  d.innerHTML = '<span>iPad 全螢幕請這樣設定<small>① 點 Safari 的分享按鈕（方框加箭頭）<br>② 選「加入主畫面」<br>③ 之後從主畫面的「叫號看板」圖示開啟</small><b>知道了</b></span>';
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}
function goFullscreen() {
  if (IS_IOS) { if (!IS_APP) showA2HS(); return; }
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitEnterFullscreen;
  try { const r = fn && fn.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.getElementById('unlock').onclick = () => {
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (!IS_IOS) goFullscreen();
  keepAwake();
  document.getElementById('unlock').remove();
};
document.getElementById('fsBtn').onclick = goFullscreen;
// 從主畫面圖示開啟時已經是全螢幕，不顯示按鈕
if (IS_APP) document.getElementById('fsBtn').style.display = 'none';
else if (IS_IOS) document.getElementById('fsBtn').textContent = '⛶ 如何全螢幕';
function chime() {
  if (!audio) return;
  [880, 660].forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    const t = audio.currentTime + i * 0.35;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.start(t); o.stop(t + 0.55);
  });
}

async function refresh() {
  const { data, error } = await sb.rpc('get_queue_board');
  if (error || !data) return;
  const serving = data.serving || [], waiting = data.waiting || [];
  const max = data.max_serving || 5;
  const top = serving[0] || null;
  const tiles = document.getElementById('tiles');
  document.getElementById('cap').textContent = `服務中 ${serving.length} / ${max}`;
  if (!serving.length) { tiles.className = 'tiles idle'; tiles.textContent = '目前沒有叫號'; }
  else {
    const shown = serving.slice(0, max).reverse();  // 先叫的在前，位置固定
    tiles.className = 'tiles';
    tiles.innerHTML = Array.from({ length: max }, (_, i) => shown[i]
      ? `<div class="tile${shown[i] === top ? ' latest' : ''}" data-n="${shown[i]}">${shown[i]}</div>`
      : '<div class="tile empty">—</div>').join('');
  }
  document.getElementById('cnt').textContent = data.waiting_count || 0;
  document.getElementById('next').innerHTML = waiting.slice(0, 6).map(n => `<span>${n}</span>`).join('');
  if (top && top !== lastTop && lastTop !== null) { const el = tiles.querySelector('.latest'); if (el) el.classList.add('flash'); chime(); }
  lastTop = top || '';
}

sb.channel('queue').on('postgres_changes', { event: '*', schema: 'public', table: 'queue_signal' }, refresh).subscribe();
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
